name: Terraform Security Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "scripts/check_storage_regressions.py"
      - ".tflint.hcl"
      - ".github/workflows/terraform-security.yml"

  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "scripts/check_storage_regressions.py"
      - ".tflint.hcl"
      - ".github/workflows/terraform-security.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_DIR: terraform/environments/dev

jobs:
  terraform-quality:
    name: Terraform Format, Validation and Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [dev, bootstrap]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform without backend
        run: |
          directory="terraform/environments/dev"
          if [ "${{ matrix.root }}" = "bootstrap" ]; then directory="terraform/bootstrap"; fi
          terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        run: |
          directory="terraform/environments/dev"
          if [ "${{ matrix.root }}" = "bootstrap" ]; then directory="terraform/bootstrap"; fi
          terraform -chdir="$directory" validate -no-color

      - name: Test storage controls and reject deliberate regressions
        run: python3 scripts/check_storage_regressions.py --root "${{ matrix.root }}"

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [terraform/environments/dev, terraform/bootstrap]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - name: Display TFLint version
        run: tflint --version

      - name: Initialize TFLint plugins
        run: >
          tflint
          --chdir="${{ matrix.directory }}"
          --init
          --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Run TFLint
        run: >
          tflint
          --chdir="${{ matrix.directory }}"
          --config="$GITHUB_WORKSPACE/.tflint.hcl"
          --format=compact

  checkov:
    name: Checkov IaC Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan Terraform with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false
          output_format: cli
