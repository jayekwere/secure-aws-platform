name: Terraform Security Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "scripts/check_storage_regressions.py"
      - "scripts/check_workflow_controls.py"
      - ".tflint.hcl"
      - ".github/workflows/terraform-security.yml"

  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "scripts/check_storage_regressions.py"
      - "scripts/check_workflow_controls.py"
      - ".tflint.hcl"
      - ".github/workflows/terraform-security.yml"

  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: terraform-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_DIR: terraform/environments/dev

jobs:
  terraform-quality:
    name: Terraform Format, Validation and Tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        root: [dev, bootstrap]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify immutable workflow references
        run: python3 scripts/check_workflow_controls.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform without backend
        run: |
          directory="terraform/environments/dev"
          if [ "${{ matrix.root }}" = "bootstrap" ]; then directory="terraform/bootstrap"; fi
          terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        run: |
          directory="terraform/environments/dev"
          if [ "${{ matrix.root }}" = "bootstrap" ]; then directory="terraform/bootstrap"; fi
          terraform -chdir="$directory" validate -no-color

      - name: Test storage controls and reject deliberate regressions
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          python3 scripts/check_storage_regressions.py --root "${{ matrix.root }}" 2>&1 | tee "artifacts/terraform-${{ matrix.root }}.txt"

      - name: Retain plan-test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: terraform-${{ matrix.root }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  tflint:
    name: TFLint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        directory: [terraform/environments/dev, terraform/bootstrap]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337
        with:
          tflint_version: v0.64.0

      - name: Display TFLint version
        run: tflint --version

      - name: Initialize TFLint plugins
        run: >
          tflint
          --chdir="${{ matrix.directory }}"
          --init
          --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Run TFLint
        run: >
          tflint
          --chdir="${{ matrix.directory }}"
          --config="$GITHUB_WORKSPACE/.tflint.hcl"
          --format=compact

  checkov:
    name: Checkov IaC Security Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Scan Terraform with Checkov
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false
          output_format: cli
